services:
  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile.frontend
    ports:
      - "127.0.0.1:8020:8080"
    depends_on:
      api-endpoint:
        condition: service_started
  api-endpoint:
    build:
      context: .
      dockerfile: ./Dockerfile.api
    environment:
      SHADYBANK_MEMBER_SERVICE_KEY: ${SHADYBANK_MEMBER_SERVICE_KEY:-}
      SHADYBANK_ALLOW_LEGACY_TRACKS: ${SHADYBANK_ALLOW_LEGACY_TRACKS:-1}
      PGHOST: db
      PGUSER: shadybucks
      PGPASSWORD: ${SHADYBANK_DB_PASSWORD:?Set SHADYBANK_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8021:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres
    environment:
      POSTGRES_USER: shadybucks
      POSTGRES_PASSWORD: ${SHADYBANK_DB_PASSWORD:?Set SHADYBANK_DB_PASSWORD in .env}
      POSTGRES_DB: shadybucks
    volumes:
      - ./srv/data/postgres.sql:/docker-entrypoint-initdb.d/00-create_db.sql
      - shadybucks-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "shadybucks", "-U", "shadybucks" ]
      timeout: 45s
      interval: 10s
      retries: 10
  redis:
    image: redis
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s
  merchant-endpoint:
    profiles: ["merchant"]
    build:
      context: .
      dockerfile: ./Dockerfile.api
    command: ["python", "src/merchant_service.py"]
    environment:
      SHADYBANK_MERCHANT_SERVICE_KEY: ${SHADYBANK_MERCHANT_SERVICE_KEY:-}
      SHADYBANK_MERCHANT_ACCOUNT_ID: ${SHADYBANK_MERCHANT_ACCOUNT_ID:-}
      SHADYBANK_MERCHANT_CAPTURE_ENABLED: ${SHADYBANK_MERCHANT_CAPTURE_ENABLED:-0}
      SHADYBANK_MERCHANT_TERMINAL_REPORTS_ENABLED: ${SHADYBANK_MERCHANT_TERMINAL_REPORTS_ENABLED:-0}
      PGHOST: db
      PGUSER: shadybucks
      PGPASSWORD: ${SHADYBANK_DB_PASSWORD:?Set SHADYBANK_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8022:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  shadybucks-db:
